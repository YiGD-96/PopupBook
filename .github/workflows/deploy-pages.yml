# Builds the book and publishes it on GitHub Pages (https://yigd-96.github.io/PopupBook/) whenever main changes.
# One-time setup in the repository: Settings → Pages → Build and deployment → Source: "GitHub Actions".
# The build's paths are relative (vite.config.ts, src/base.ts), so the same dist also works on any other host.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Absolute addresses for search engines and link previews (canonical, og:image, sitemap).
          VITE_SITE_URL: https://yigd-96.github.io/PopupBook
          # Optional: set a repository variable VITE_GA_ID to turn on Google Analytics.
          VITE_GA_ID: ${{ vars.VITE_GA_ID }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
