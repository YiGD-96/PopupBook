<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#2f7a5c"/></marker>
    <filter id="s" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#2f4a3c" flood-opacity=".15"/></filter>
  </defs>
  <rect width="760" height="300" rx="18" fill="#f0f7f2"/>
  <text x="32" y="44" font-size="20" font-weight="700" fill="#24543f">추천 · 책 이벤트도 GTM으로 보내기</text>
  <text x="32" y="70" font-size="14" fill="#4f7a66">책이 이벤트를 GTM에 넘기면(dataLayer), GTM 하나로 전부 관리돼요.</text>

  <!-- Book -->
  <g filter="url(#s)"><rect x="32" y="100" width="190" height="160" rx="14" fill="#fff"/></g>
  <rect x="32" y="100" width="190" height="38" rx="14" fill="#e07a3a"/>
  <rect x="32" y="124" width="190" height="14" fill="#e07a3a"/>
  <text x="50" y="125" font-size="15" font-weight="700" fill="#fff">📖 팝업북</text>
  <text x="50" y="166" font-size="13" fill="#2f7a5c" font-weight="600">✓ 처음 접속</text>
  <text x="50" y="188" font-size="13" fill="#2f7a5c" font-weight="600">✓ 장 넘김</text>
  <text x="50" y="210" font-size="13" fill="#2f7a5c" font-weight="600">✓ 이야기 열기</text>
  <text x="50" y="232" font-size="13" fill="#2f7a5c" font-weight="600">✓ 쇼츠 재생 · 링크</text>

  <line x1="230" y1="180" x2="300" y2="180" stroke="#2f7a5c" stroke-width="3" marker-end="url(#a)"/>

  <!-- dataLayer -->
  <g filter="url(#s)"><rect x="310" y="140" width="130" height="80" rx="12" fill="#fff"/></g>
  <text x="375" y="172" font-size="13" font-weight="700" fill="#24543f" text-anchor="middle">dataLayer</text>
  <text x="375" y="194" font-size="11" fill="#4f7a66" text-anchor="middle">책 → GTM 전달 통로</text>

  <line x1="448" y1="180" x2="510" y2="180" stroke="#2f7a5c" stroke-width="3" marker-end="url(#a)"/>

  <!-- GTM -->
  <g filter="url(#s)"><rect x="520" y="100" width="208" height="160" rx="14" fill="#fff"/></g>
  <rect x="520" y="100" width="208" height="38" rx="14" fill="#1a73e8"/>
  <rect x="520" y="124" width="208" height="14" fill="#1a73e8"/>
  <text x="538" y="125" font-size="15" font-weight="700" fill="#fff">🧰 GTM → 📊 GA4</text>
  <text x="538" y="166" font-size="13" fill="#1f3b63">모든 이벤트가 GA4에</text>
  <text x="538" y="188" font-size="13" fill="#1f3b63">GA4 두 개도 GTM에서</text>
  <text x="538" y="210" font-size="13" fill="#1f3b63">설정 변경은 GTM에서만</text>
  <rect x="538" y="224" width="172" height="24" rx="12" fill="#fde3cf"/>
  <text x="624" y="241" font-size="11" font-weight="600" fill="#a24f25" text-anchor="middle">VITE_GA_ID는 비워 두기</text>

  <text x="32" y="286" font-size="12" fill="#4f7a66">한 번만 코드를 고치면(책 → dataLayer), 그다음부터는 GTM 화면에서 다 할 수 있어요.</text>
</svg>
